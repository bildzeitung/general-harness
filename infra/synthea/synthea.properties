# synthea.properties — Minimal Synthea configuration for FHIR R4 + CSV export.
# All exporters are disabled except FHIR R4 and CSV.
# CSV export is explicitly enabled here so the properties file does not override
# runtime JVM flags (-Dexporter.csv.export=true via JAVA_TOOL_OPTIONS).
# Do NOT enable US Core IG (exporter.fhir.use_us_core_ig must remain false/unset).

# Disable all non-FHIR/non-CSV exporters
exporter.ccda.export = false
exporter.hl7.export = false
exporter.json.export = false
exporter.text.export = false
exporter.cpcds.export = false
exporter.symptoms.csv.export = false
exporter.symptoms.mode = 0

# Enable CSV export and restrict output to patients.csv only
exporter.csv.export = true
exporter.csv.included_files = patients.csv

# Enable FHIR R4 export
exporter.fhir.export = true

# Do not enable US Core IG
# exporter.fhir.use_us_core_ig = false
